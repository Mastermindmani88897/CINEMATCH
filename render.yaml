services:
  - type: web
    name: cinematch-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=/opt/render/project/src uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: cinematch_db
      - key: MONGODB_URI
        sync: false  # Paste your MongoDB Atlas connection string in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: /opt/render/project/src
